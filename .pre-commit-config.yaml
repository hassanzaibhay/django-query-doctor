# Pre-push checks -- local convenience, not enforcement.
# `git push --no-verify` bypasses this; CI required status checks are the real gate.
# One-time setup: pre-commit install --hook-type pre-push
#
# Every entry runs through `scripts/hookenv.py`, which resolves this
# repository's virtualenv explicitly instead of letting `PATH` decide, and
# prints the interpreter it used. `language: python` gives that launcher a
# pre-commit-managed interpreter to start from, so the hooks do not depend on
# the pushing shell having anything on `PATH`. `PATH`-resolved hooks failed
# three times in this repository before this launcher existed; `hookenv.py`'s
# own docstring records the failure modes.
#
# Both the paths AND the invocation form here are kept identical to
# `.github/workflows/ci.yml` so a hook and its CI counterpart cannot diverge --
# that divergence is how `scripts/` ended up linted and type-checked by neither.
# Invocation form is not cosmetic: `python scripts/x.py` puts `scripts/` on
# sys.path[0] while `python -m scripts.x` puts the repository root there, so the
# first intra-package import written would pass one and break the other. Both
# sides use `-m`.
#
# `pytest` runs last and under coverage, so the 85% floor is enforced before a
# push rather than only in CI. The `--cov-report=xml` matches CI's invocation.
default_stages: [pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: python scripts/hookenv.py ruff check src/ tests/ scripts/
        language: python
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format --check
        entry: python scripts/hookenv.py ruff format src/ tests/ scripts/ --check
        language: python
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy
        entry: python scripts/hookenv.py mypy src/query_doctor/ scripts/
        language: python
        pass_filenames: false
        always_run: true
      - id: docs-truth-sweep
        name: docs truth sweep
        entry: python scripts/hookenv.py scripts.docs_truth_sweep
        language: python
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: python scripts/hookenv.py pytest -q --cov=query_doctor --cov-report=xml
        language: python
        pass_filenames: false
        always_run: true
