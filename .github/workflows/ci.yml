name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.0", "5.1", "5.2", "6.0"]
        # Only combinations Django itself cannot install are excluded.
        # Django 6.0 declares requires_python >= 3.12, so 3.10 and 3.11 are
        # impossible. Django 5.1 and 5.2 both declare >= 3.10, so 3.10 x 5.1
        # and 3.10 x 5.2 are supported and are now exercised: the README and
        # the trove classifiers claim them, and a classifier is a claim made
        # to the installer, not just to a reader. 20 - 2 = 18 jobs.
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install "django~=${{ matrix.django-version }}.0"
      - name: Run tests with coverage
        run: pytest --cov=query_doctor --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.django-version == '5.2'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          # A rejected upload must fail the job. With `false` this step reported
          # success on a run whose upload was refused outright, which is a step
          # structurally incapable of reporting failure. If this ever fires, the
          # remedy is a CODECOV_TOKEN secret, not a revert.
          fail_ci_if_error: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install ruff
      - name: Check linting
        run: ruff check src/ tests/ scripts/ benchmarks/
      - name: Check formatting
        run: ruff format src/ tests/ scripts/ benchmarks/ --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run mypy
        run: mypy src/query_doctor/ scripts/ benchmarks/

  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The sweep is a static AST check over the tree and imports nothing from
      # the package, so it needs no install. Verified against an interpreter
      # with no project dependencies.
      - name: Docs truth sweep
        run: python -m scripts.docs_truth_sweep
      # Same property: a tokenize/ast pass over the tracked tree with no
      # project import, so it runs in this install-free job too.
      - name: ASCII dash gate
        run: python -m scripts.dash_gate

  # Deliberately a separate job from `docs-gate`, not another step in it.
  # `docs-gate` documents itself as needing no install because the sweep
  # imports nothing from the package; the strict build needs
  # `pip install -e ".[docs]"`, so folding it in would silently invalidate
  # that property. Before this job existed the strict build ran only in a
  # contributor's terminal: `docs.yml` runs `mkdocs gh-deploy --force` on
  # push to `main`, which builds without `--strict` and only after a merge.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `mkdocs-git-revision-date-localized-plugin` reads commit history
          # for every page. A shallow clone makes it fall back to the current
          # timestamp, and `--strict` promotes build warnings to errors.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[docs]"
      - name: Build docs strictly
        run: mkdocs build --strict
